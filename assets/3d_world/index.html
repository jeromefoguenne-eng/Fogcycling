<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>Fogcycling 3D Studio Engine v3.0 — Peloton 150 Coureurs</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #38bdf8; }
    #canvas-container { width: 100%; height: 100%; display: block; }
  </style>
  <script src="three.min.js"></script>
</head>
<body>
  <div id="canvas-container"></div>

  <script>
    // ==============================================================================
    // FOGCYCLING 3D STUDIO ENGINE v3.0 (STYLE ILLUSTRATION PIXAR/ZWIFT HD)
    // - Rendu Haute Fidélité calqué sur l'illustration de référence :
    //   Maillot & Cuissard "FOG" Jaune/Bleu, Vélo Carbone Bleu/Orange avec logo FOG,
    //   freins à disque, bidon, dérailleur, pneus à flancs ambrés, visage sculpté.
    // - Route de montagne sinueuse avec traces de pneus, glissières métalliques,
    //   fleurs sauvages alpines, forêts de sapins denses et sommets enneigés.
    // - PELOTON MASSIF DE 150 COUREURS 3D ANIMÉS avec dynamique de remontée/placement.
    // ==============================================================================

    let scene, camera, renderer;
    let cyclistGroup, bikeFrame, frontWheelGroup, rearWheelGroup, crankset;
    let leftThigh, leftCalf, leftFoot, rightThigh, rightCalf, rightFoot, leftKnee, rightKnee;
    let roadSegments = [], cloudPool = [], peloton150Pool = [];
    let workoutArch, groundMesh, skyDomeMesh;
    let playerBikeFrameMat, playerJerseyMat;

    // Télémétrie & État du Peloton de 150 coureurs reçus de Flutter
    let targetWatts = 0, currentWatts = 0;
    let targetCadence = 0, currentCadence = 0;
    let targetSpeed = 0, currentSpeed = 0; // m/s
    let currentSlope = 0.0;
    let currentGear = 14;
    let distanceTraveled = 0;

    // Position du joueur au sein du peloton de 150 coureurs (1 = en tête, 150 = en queue)
    let targetPlayerRank = 45;
    let smoothPlayerRank = 45.0;
    let targetLateralLane = 0.0; // Décalage latéral quand le joueur remonte sur l'aile
    let smoothLateralLane = 0.0;

    // Modes de caméra : 0 = Vue 3/4 Héroïque (Illustration de référence), 1 = Immersion Peloton Arrière, 2 = Hélicoptère TV
    let cameraMode = 0;
    let pedalAngle = 0;
    let clock = new THREE.Clock();

    // Courbure sinueuse de grand col alpin (lacets panoramiques)
    function getRoadCurveX(zWorld) {
      return Math.sin(zWorld * 0.022) * 5.8 + Math.cos(zWorld * 0.009) * 2.6;
    }

    function getRoadCurveDerivative(zWorld) {
      return Math.cos(zWorld * 0.022) * 0.022 * 5.8 - Math.sin(zWorld * 0.009) * 0.009 * 2.6;
    }

    // ─── GÉNÉRATEURS DE TEXTURES PROCÉDURALES HD (CANVAS 2D -> WEBGL) ──────────
    function createAsphaltTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');

      // Base bitume gris-bleu alpin
      ctx.fillStyle = '#475569';
      ctx.fillRect(0, 0, 512, 512);

      // Grain d'asphalte réaliste
      for (let i = 0; i < 6000; i++) {
        ctx.fillStyle = (i % 2 === 0) ? 'rgba(255,255,255,0.035)' : 'rgba(15,23,42,0.05)';
        ctx.fillRect(Math.random() * 512, Math.random() * 512, 2, 2);
      }

      // Traces de gomme / trajectoires de course dans le virage (comme sur l'aperçu !)
      ctx.strokeStyle = 'rgba(30, 41, 59, 0.38)';
      ctx.lineWidth = 6;
      for (let t = 0; t < 5; t++) {
        ctx.beginPath();
        const xOff = 150 + t * 14;
        ctx.moveTo(xOff, 0);
        ctx.lineTo(xOff, 512);
        ctx.stroke();
      }

      // Bandes blanches de rive gauche et droite
      ctx.fillStyle = '#f8fafc';
      ctx.fillRect(18, 0, 14, 512);
      ctx.fillRect(480, 0, 14, 512);

      // Ligne médiane blanche discontinue
      ctx.fillStyle = '#f8fafc';
      ctx.fillRect(250, 40, 12, 180);
      ctx.fillRect(250, 300, 12, 180);

      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      return tex;
    }

    function createFogJerseyTexture(primaryHexStr) {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');

      // Haut jaune d'or éclatant & bande bleu cyan (exactement comme l'illustration FOG !)
      ctx.fillStyle = primaryHexStr || '#facc15';
      ctx.fillRect(0, 0, 512, 512);

      // Bande pectorale et dorsale bleu pro
      ctx.fillStyle = '#0284c7';
      ctx.fillRect(0, 210, 512, 130);

      // Liséré noir/or
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 200, 512, 12);
      ctx.fillRect(0, 340, 512, 12);

      // Inscription "FOG" nette devant et dans le dos
      ctx.fillStyle = '#facc15';
      ctx.font = '900 76px Arial, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('FOG', 128, 298);
      ctx.fillText('FOG', 384, 298);

      return new THREE.CanvasTexture(canvas);
    }

    function createSkyGradientTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');
      const grad = ctx.createLinearGradient(0, 0, 0, 512);
      grad.addColorStop(0.0, '#1d4ed8');
      grad.addColorStop(0.35, '#38bdf8');
      grad.addColorStop(0.72, '#bae6fd');
      grad.addColorStop(1.0, '#fef9c3');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 256, 512);
      return new THREE.CanvasTexture(canvas);
    }

    function init() {
      const container = document.getElementById('canvas-container');

      // 1. SCÈNE & BROUILLARD ATMOSPHÉRIQUE LUMINEUX
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x7dd3fc);
      scene.fog = new THREE.FogExp2(0xbae6fd, 0.0042);

      // 2. CAMÉRA HÉROÏQUE 3/4 PAR DÉFAUT (COMME SUR L'APERÇU !)
      camera = new THREE.PerspectiveCamera(46, window.innerWidth / window.innerHeight, 0.1, 900);

      // 3. MOTEUR DE RENDU WEBGL PBR + ACES FILMIC
      renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2.0));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      if (THREE.ACESFilmicToneMapping) {
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.12;
      }
      container.appendChild(renderer.domElement);

      // 4. ÉCLAIRAGE STUDIO À 3 POINTS (KEY SUNLIGHT + FILL + RIM)
      const hemiLight = new THREE.HemisphereLight(0xfef9c3, 0x15803d, 0.92);
      scene.add(hemiLight);

      // Soleil doré (Haut-Gauche comme sur l'illustration)
      const sunLight = new THREE.DirectionalLight(0xfffbeb, 1.55);
      sunLight.position.set(-28, 42, 18);
      sunLight.castShadow = true;
      sunLight.shadow.mapSize.width = 2048;
      sunLight.shadow.mapSize.height = 2048;
      sunLight.shadow.camera.near = 2;
      sunLight.shadow.camera.far = 140;
      sunLight.shadow.camera.left = -22;
      sunLight.shadow.camera.right = 22;
      sunLight.shadow.camera.top = 22;
      sunLight.shadow.camera.bottom = -22;
      sunLight.shadow.bias = -0.0005;
      scene.add(sunLight);

      // Rim Light (contre-jour qui fait briller le casque, les épaules et le cadre carbone)
      const rimLight = new THREE.DirectionalLight(0x38bdf8, 0.75);
      rimLight.position.set(22, 18, -25);
      scene.add(rimLight);

      // Dôme céleste dégradé + Soleil éblouissant
      const skyGeo = new THREE.SphereGeometry(480, 32, 24);
      const skyMat = new THREE.MeshBasicMaterial({ map: createSkyGradientTexture(), side: THREE.BackSide });
      skyDomeMesh = new THREE.Mesh(skyGeo, skyMat);
      scene.add(skyDomeMesh);

      const sunGlow = new THREE.Mesh(
        new THREE.SphereGeometry(16, 24, 24),
        new THREE.MeshBasicMaterial({ color: 0xfef08a })
      );
      sunGlow.position.set(-95, 115, 240);
      scene.add(sunGlow);

      // 5. ENVIRONNEMENT ALPIN HAUTE DÉFINITION
      createTerrainAndMeadows();
      createMajesticAlpinePeaks();
      createClouds();
      createDetailedRoadStream();
      createWorkoutArch();

      // 6. HÉROS CYCLISTE "FOG" ULTRA-DÉTAILLÉ + PELOTON MASSIF DE 150 COUREURS
      createHeroCyclistAndProBike();
      createPeloton150Cyclists();

      window.addEventListener('resize', onWindowResize, false);
      animate();
    }

    // ─── PRAIRIES ALPINES & MONTAGNES SCULPTÉES ──────────────────────────────
    function createTerrainAndMeadows() {
      const groundGeo = new THREE.PlaneGeometry(700, 700, 32, 32);
      const groundMat = new THREE.MeshStandardMaterial({
        color: 0x4ade80,
        roughness: 0.88,
        metalness: 0.02
      });
      groundMesh = new THREE.Mesh(groundGeo, groundMat);
      groundMesh.rotation.x = -Math.PI / 2;
      groundMesh.position.y = -0.05;
      groundMesh.receiveShadow = true;
      scene.add(groundMesh);
    }

    function createMajesticAlpinePeaks() {
      // Massifs rocheux facettés façon illustration avec neiges éternelles étincelantes
      const rockColors = [0x64748b, 0x475569, 0x94a3b8];
      const snowMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.35, metalness: 0.05 });

      for (let i = 0; i < 32; i++) {
        const height = 55 + (i % 5) * 24;
        const radius = 32 + (i % 4) * 16;
        const peakGroup = new THREE.Group();

        const rockGeo = new THREE.ConeGeometry(radius, height, 6);
        const rockMat = new THREE.MeshStandardMaterial({
          color: rockColors[i % rockColors.length],
          roughness: 0.75,
          flatShading: true
        });
        const rock = new THREE.Mesh(rockGeo, rockMat);
        rock.position.y = height / 2 - 3;
        peakGroup.add(rock);

        // Névé / Sommet enneigé sculpté
        const capH = height * 0.42;
        const capR = radius * 0.43;
        const capGeo = new THREE.ConeGeometry(capR, capH, 6);
        const cap = new THREE.Mesh(capGeo, snowMat);
        cap.position.y = height - capH / 2 - 2.5;
        peakGroup.add(cap);

        const side = (i % 2 === 0) ? 1 : -1;
        peakGroup.position.x = side * (55 + (i % 3) * 35);
        peakGroup.position.z = 45 + i * 16;
        peakGroup.rotation.y = (i * 0.7);
        scene.add(peakGroup);
      }
    }

    function createClouds() {
      const cloudMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.6 });
      for (let i = 0; i < 18; i++) {
        const cloud = new THREE.Group();
        for (let p = 0; p < 5; p++) {
          const puff = new THREE.Mesh(new THREE.SphereGeometry(3.5 + (p % 2) * 1.8, 12, 12), cloudMat);
          puff.scale.set(1.3, 0.75, 1.0);
          puff.position.set(p * 3.1, (p % 2) * 0.9, 0);
          cloud.add(puff);
        }
        cloud.position.set(-120 + i * 15, 38 + (i % 4) * 8, 40 + i * 18);
        cloudPool.push(cloud);
        scene.add(cloud);
      }
    }

    function createLushAlpineFirTree(seed) {
      const tree = new THREE.Group();
      const trunkMat = new THREE.MeshStandardMaterial({ color: 0x5c2d0c, roughness: 0.9 });
      const darkLeafMat = new THREE.MeshStandardMaterial({ color: 0x166534, roughness: 0.7, flatShading: true });
      const brightLeafMat = new THREE.MeshStandardMaterial({ color: 0x22c55e, roughness: 0.65, flatShading: true });

      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.30, 1.8, 7), trunkMat);
      trunk.position.y = 0.9;
      trunk.castShadow = true;
      tree.add(trunk);

      // 4 étages de branches denses comme sur l'aperçu
      for (let l = 0; l < 4; l++) {
        const cone = new THREE.Mesh(
          new THREE.ConeGeometry(1.75 - l * 0.32, 2.2 - l * 0.22, 8),
          l % 2 === 0 ? darkLeafMat : brightLeafMat
        );
        cone.position.y = 2.0 + l * 1.15;
        cone.castShadow = true;
        tree.add(cone);
      }
      const s = 0.9 + (seed % 5) * 0.14;
      tree.scale.set(s, s, s);
      return tree;
    }

    // ─── ROUTE DE MONTAGNE AVEC GLISSIÈRES MÉTALLIQUES, FLEURS & TRACES ──────
    function createDetailedRoadStream() {
      const segmentCount = 55;
      const segmentLength = 4.0;
      const asphaltTex = createAsphaltTexture();

      const roadMat = new THREE.MeshStandardMaterial({
        map: asphaltTex,
        roughness: 0.65,
        metalness: 0.08
      });
      const shoulderMat = new THREE.MeshStandardMaterial({ color: 0x65a30d, roughness: 0.85 });
      const guardrailMat = new THREE.MeshStandardMaterial({ color: 0xcbd5e1, metalness: 0.75, roughness: 0.25 });
      const postMat = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.4 });
      const reflectorMat = new THREE.MeshBasicMaterial({ color: 0xef4444 });
      const flowerColors = [0xfacc15, 0xffffff, 0xc084fc, 0xf87171];

      for (let i = 0; i < segmentCount; i++) {
        const segGroup = new THREE.Group();

        // Bas-côté herbeux fleuri
        const bank = new THREE.Mesh(new THREE.BoxGeometry(10.5, 0.08, segmentLength + 0.1), shoulderMat);
        bank.position.y = -0.02;
        bank.receiveShadow = true;
        segGroup.add(bank);

        // Chaussée bitumée large (7.6m pour accueillir le peloton de 150 coureurs)
        const road = new THREE.Mesh(new THREE.BoxGeometry(7.6, 0.10, segmentLength + 0.08), roadMat);
        road.position.y = 0.01;
        road.receiveShadow = true;
        segGroup.add(road);

        // Glissière de sécurité métallique à gauche (exactement comme sur l'aperçu !)
        const railBeam = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.22, segmentLength + 0.06), guardrailMat);
        railBeam.position.set(-4.1, 0.48, 0);
        railBeam.castShadow = true;
        segGroup.add(railBeam);

        const railPost = new THREE.Mesh(new THREE.BoxGeometry(0.10, 0.52, 0.10), guardrailMat);
        railPost.position.set(-4.15, 0.26, 0);
        segGroup.add(railPost);

        // Délinéateurs blancs/rouges à droite
        if (i % 2 === 0) {
          const post = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.65, 8), postMat);
          post.position.set(4.1, 0.32, 0);
          segGroup.add(post);

          const ref = new THREE.Mesh(new THREE.BoxGeometry(0.11, 0.14, 0.11), reflectorMat);
          ref.position.set(4.1, 0.52, 0);
          segGroup.add(ref);
        }

        // Touffes de fleurs sauvages alpines au bord de la route
        for (let f = 0; f < 4; f++) {
          const flMat = new THREE.MeshBasicMaterial({ color: flowerColors[(i + f) % flowerColors.length] });
          const flower = new THREE.Mesh(new THREE.SphereGeometry(0.09, 6, 6), flMat);
          const side = (f % 2 === 0) ? -1 : 1;
          flower.position.set(side * (4.3 + (f * 0.35)), 0.08, (f - 1.5) * 0.9);
          segGroup.add(flower);
        }

        // Forêt de sapins alpins de part et d'autre
        const leftTree = createLushAlpineFirTree(i);
        leftTree.position.set(-6.5 - (i % 4) * 2.8, 0, -0.8);
        segGroup.add(leftTree);

        const rightTree = createLushAlpineFirTree(i + 3);
        rightTree.position.set(6.5 + ((i + 2) % 4) * 2.8, 0, 0.8);
        segGroup.add(rightTree);

        segGroup.userData = { baseZ: i * segmentLength - 24 };
        segGroup.position.z = segGroup.userData.baseZ;
        roadSegments.push(segGroup);
        scene.add(segGroup);
      }
    }

    function createWorkoutArch() {
      workoutArch = new THREE.Group();
      const archPillarMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, metalness: 0.5, roughness: 0.3 });
      const archGlowMat = new THREE.MeshBasicMaterial({ color: 0xfacc15 });

      const leftPillar = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.30, 5.2, 12), archPillarMat);
      leftPillar.position.set(-4.0, 2.6, 0);
      workoutArch.add(leftPillar);

      const rightPillar = leftPillar.clone();
      rightPillar.position.x = 4.0;
      workoutArch.add(rightPillar);

      const topBanner = new THREE.Mesh(new THREE.BoxGeometry(8.6, 0.85, 0.4), archPillarMat);
      topBanner.position.set(0, 5.0, 0);
      workoutArch.add(topBanner);

      const neonStrip = new THREE.Mesh(new THREE.BoxGeometry(8.2, 0.48, 0.44), archGlowMat);
      neonStrip.position.set(0, 5.0, 0);
      workoutArch.add(neonStrip);

      workoutArch.position.z = 95;
      scene.add(workoutArch);
    }

    // ─── ROUES PRO CARBONE À FLANCS AMBRÉS + FREINS À DISQUE ─────────────────
    function createBikeWheel(radius, isDetailedHero) {
      const wheelGroup = new THREE.Group();

      // Pneu route noir
      const tireGeo = new THREE.TorusGeometry(radius, 0.028, 12, isDetailedHero ? 36 : 18);
      tireGeo.rotateY(Math.PI / 2);
      const tireMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.75 });
      wheelGroup.add(new THREE.Mesh(tireGeo, tireMat));

      // Flancs beiges/ambrés ("Tan-wall tires" exactement comme sur l'aperçu !)
      const sidewallGeo = new THREE.TorusGeometry(radius - 0.016, 0.015, 8, isDetailedHero ? 32 : 16);
      sidewallGeo.rotateY(Math.PI / 2);
      const sidewallMat = new THREE.MeshBasicMaterial({ color: 0xd97706 });
      wheelGroup.add(new THREE.Mesh(sidewallGeo, sidewallMat));

      // Jante Carbone Profil Haut
      const rimGeo = new THREE.TorusGeometry(radius - 0.036, 0.022, 8, isDetailedHero ? 32 : 16);
      rimGeo.rotateY(Math.PI / 2);
      const rimMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.25, metalness: 0.4 });
      wheelGroup.add(new THREE.Mesh(rimGeo, rimMat));

      if (isDetailedHero) {
        // Disque de frein métallique (Disc brake rotor)
        const discGeo = new THREE.CylinderGeometry(0.085, 0.085, 0.006, 20);
        discGeo.rotateZ(Math.PI / 2);
        const discMat = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, metalness: 0.85, roughness: 0.2 });
        const disc = new THREE.Mesh(discGeo, discMat);
        disc.position.x = -0.035;
        wheelGroup.add(disc);

        // 14 Rayons fins argentés
        const spokeMat = new THREE.MeshBasicMaterial({ color: 0xcbd5e1 });
        for (let i = 0; i < 8; i++) {
          const angle = (i * Math.PI) / 4;
          const spokeGeo = new THREE.CylinderGeometry(0.0025, 0.0025, (radius - 0.04) * 2, 6);
          const spoke = new THREE.Mesh(spokeGeo, spokeMat);
          spoke.rotation.x = angle;
          wheelGroup.add(spoke);
        }
      } else {
        // 4 croix de rayons optimisées pour les 150 coureurs du peloton (60 FPS garanti)
        const spokeMat = new THREE.MeshBasicMaterial({ color: 0x94a3b8 });
        for (let i = 0; i < 4; i++) {
          const spoke = new THREE.Mesh(
            new THREE.CylinderGeometry(0.003, 0.003, (radius - 0.04) * 2, 4),
            spokeMat
          );
          spoke.rotation.x = (i * Math.PI) / 4;
          wheelGroup.add(spoke);
        }
      }

      return wheelGroup;
    }

    function createTubeBetween(p1, p2, r1, r2, material) {
      const dir = new THREE.Vector3().subVectors(p2, p1);
      const len = dir.length();
      const geo = new THREE.CylinderGeometry(r1, r2, len, 12);
      const mesh = new THREE.Mesh(geo, material);
      mesh.position.copy(p1).add(p2).multiplyScalar(0.5);
      mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize());
      mesh.castShadow = true;
      return mesh;
    }

    // ─── CYCLISTE HÉROS "FOG" & VÉLO PRO (FIDÈLE À L'ILLUSTRATION 100%) ──────
    function createHeroCyclistAndProBike() {
      cyclistGroup = new THREE.Group();
      bikeFrame = new THREE.Group();

      // Matériaux PBR vernis (Clearcoat Carbone Bleu & Accents Orange comme sur l'image)
      const frameBlueMat = new THREE.MeshPhysicalMaterial({
        color: 0x0284c7,
        roughness: 0.2,
        metalness: 0.15,
        clearcoat: 1.0,
        clearcoatRoughness: 0.1
      });
      playerBikeFrameMat = frameBlueMat;

      const frameOrangeMat = new THREE.MeshPhysicalMaterial({
        color: 0xf97316,
        roughness: 0.2,
        metalness: 0.1,
        clearcoat: 1.0
      });
      const darkCarbonMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.35, metalness: 0.3 });
      const chromeMat = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, metalness: 0.85, roughness: 0.15 });

      const wheelRadius = 0.34;
      const rearAxle = new THREE.Vector3(0, wheelRadius, -0.52);
      const frontAxle = new THREE.Vector3(0, wheelRadius, 0.54);
      const bottomBracket = new THREE.Vector3(0, 0.29, -0.08);
      const seatNode = new THREE.Vector3(0, 0.82, -0.24);
      const headTubeTop = new THREE.Vector3(0, 0.84, 0.40);
      const headTubeBottom = new THREE.Vector3(0, 0.67, 0.44);

      // 1. Roues Pro à disques et flancs ambrés
      frontWheelGroup = createBikeWheel(wheelRadius, true);
      frontWheelGroup.position.copy(frontAxle);
      bikeFrame.add(frontWheelGroup);

      rearWheelGroup = createBikeWheel(wheelRadius, true);
      rearWheelGroup.position.copy(rearAxle);
      bikeFrame.add(rearWheelGroup);

      // 2. Cadre Aéro Carbone Bi-Ton (Bleu + Fourche/Tube Orange comme sur l'aperçu)
      bikeFrame.add(createTubeBetween(seatNode, headTubeTop, 0.025, 0.028, frameBlueMat));
      bikeFrame.add(createTubeBetween(bottomBracket, headTubeBottom, 0.032, 0.030, frameBlueMat));
      bikeFrame.add(createTubeBetween(bottomBracket, seatNode, 0.024, 0.026, frameBlueMat));
      bikeFrame.add(createTubeBetween(headTubeBottom, headTubeTop, 0.028, 0.028, frameOrangeMat));

      // Bidon (Gourde jaune & noire dans son porte-bidon sur le tube diagonal !)
      const bottleGroup = new THREE.Group();
      const bottleBody = new THREE.Mesh(
        new THREE.CylinderGeometry(0.036, 0.036, 0.16, 12),
        new THREE.MeshStandardMaterial({ color: 0xfacc15, roughness: 0.3 })
      );
      const bottleCap = new THREE.Mesh(
        new THREE.CylinderGeometry(0.038, 0.038, 0.04, 12),
        darkCarbonMat
      );
      bottleCap.position.y = 0.09;
      bottleGroup.add(bottleBody, bottleCap);
      bottleGroup.position.set(0, 0.49, 0.12);
      bottleGroup.rotation.x = -0.72;
      bikeFrame.add(bottleGroup);

      // Haubans, bases arrière, fourche avant bicolore & dérailleur arrière

    // ─── CRÉATION DU PELOTON MASSIF DE 150 COUREURS 3D SUR LA ROUTE ──────────
    function createPeloton150Cyclists() {
      const totalRiders = 150;
      const teamJerseyColors = [
        0x0284c7, // Équipiers FOG (Bleu/Or)
        0xfacc15, // Maillot Jaune / Visma
        0x22c55e, // Maillot Vert / Bora
        0xef4444, // Maillot à Pois / Ineos / UAE
        0xffffff, // Groupama / Decathlon
        0xf97316, // Euskaltel / CCC
        0x9333ea, // Jayco / SD Worx
        0xec4899, // EF Education (Rose)
        0x14b8a6  // Astana / Bahrain
      ];

      const darkMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.5 });
      const skinMat = new THREE.MeshStandardMaterial({ color: 0xfdba74, roughness: 0.5 });

      // Géométries partagées en mémoire GPU pour afficher 150 cyclistes à 60 FPS sans ralentissement !
      const sharedTorsoGeo = new THREE.CylinderGeometry(0.135, 0.115, 0.40, 8);
      const sharedHeadGeo = new THREE.SphereGeometry(0.105, 8, 8);
      const sharedHelmetGeo = new THREE.SphereGeometry(0.12, 8, 8);
      const sharedLegGeo = new THREE.CylinderGeometry(0.048, 0.035, 0.48, 6);

      // Matériaux partagés par équipe (9 équipes)
      const teamMats = teamJerseyColors.map(c => new THREE.MeshStandardMaterial({ color: c, roughness: 0.42 }));

      for (let i = 0; i < totalRiders; i++) {
        const rider = new THREE.Group();
        const isTeammate = (i >= 40 && i <= 44);
        const jMat = isTeammate ? teamMats[0] : teamMats[i % teamMats.length];

        // Roues avant et arrière
        const rWheel = createBikeWheel(0.32, false);
        rWheel.position.set(0, 0.32, -0.46);
        rider.add(rWheel);

        const fWheel = createBikeWheel(0.32, false);
        fWheel.position.set(0, 0.32, 0.46);
        rider.add(fWheel);

        // Cadre épuré
        const frameTube = new THREE.Mesh(
          new THREE.BoxGeometry(0.03, 0.38, 0.78),
          isTeammate ? teamMats[5] : darkMat
        );
        frameTube.position.set(0, 0.54, 0.0);
        rider.add(frameTube);

        // Buste & Maillot d'équipe
        const torso = new THREE.Mesh(sharedTorsoGeo, jMat);
        torso.position.set(0, 1.10, -0.04);
        torso.rotation.x = Math.PI / 3.4;
        rider.add(torso);

        // Tête & Casque profilé
        const head = new THREE.Mesh(sharedHeadGeo, skinMat);
        head.position.set(0, 1.36, 0.14);
        rider.add(head);

        const helmet = new THREE.Mesh(sharedHelmetGeo, jMat);
        helmet.scale.set(1.0, 0.82, 1.25);
        helmet.position.set(0, 1.40, 0.14);
        rider.add(helmet);

        // Jambes animées gauche/droite (oscillation en opposition de phase)
        const legL = new THREE.Mesh(sharedLegGeo, skinMat);
        legL.position.set(-0.09, 0.65, -0.08);
        rider.add(legL);

        const legR = new THREE.Mesh(sharedLegGeo, skinMat);
        legR.position.set(0.09, 0.65, -0.08);
        rider.add(legR);

        // Répartition en formation de peloton dense (5 colonnes de large x 30 rangées = 150 coureurs)
        const row = Math.floor(i / 5); // 0 (tête de course) à 29 (queue de peloton)
        const col = i % 5;             // 0 à 4 sur la largeur de la route
        const laneX = (col - 2) * 0.72 + ((row % 2) * 0.28 - 0.14);

        rider.userData = {
          rankIndex: i + 1, // Rang 1 à 150 dans le peloton
          row: row,
          laneX: laneX,
          legL: legL,
          legR: legR,
          rWheel: rWheel,
          fWheel: fWheel,
          phase: (i * 0.73) % (Math.PI * 2)
        };

        peloton150Pool.push(rider);
        scene.add(rider);
      }
    }

    // ─── CINÉMATIQUE DE PÉDALAGE DU JOUEUR ───────────────────────────────────
    function updatePedaling(delta) {
      currentWatts += (targetWatts - currentWatts) * 0.12;
      currentCadence += (targetCadence - currentCadence) * 0.12;
      currentSpeed += (targetSpeed - currentSpeed) * 0.12;
      smoothPlayerRank += (targetPlayerRank - smoothPlayerRank) * 0.06;
      smoothLateralLane += (targetLateralLane - smoothLateralLane) * 0.08;

      const rps = Math.max(currentCadence, 15) / 60.0;
      pedalAngle += rps * Math.PI * 2 * delta;
      crankset.rotation.x = pedalAngle;

      const wheelCircumference = 2.136;
      const wheelAngularVel = (Math.max(currentSpeed, 3.0) / wheelCircumference) * Math.PI * 2;
      frontWheelGroup.rotation.x += wheelAngularVel * delta;
      rearWheelGroup.rotation.x += wheelAngularVel * delta;

      const hipL = new THREE.Vector3(-0.11, 1.00, -0.25);
      const hipR = new THREE.Vector3(0.11, 1.00, -0.25);
      const crankRadius = 0.165;

      const pedalLY = 0.29 + Math.cos(pedalAngle) * crankRadius;
      const pedalLZ = -0.08 + Math.sin(pedalAngle) * crankRadius;
      const pedalRY = 0.29 + Math.cos(pedalAngle + Math.PI) * crankRadius;
      const pedalRZ = -0.08 + Math.sin(pedalAngle + Math.PI) * crankRadius;

      solveLegIK(hipL, new THREE.Vector3(-0.11, pedalLY, pedalLZ), leftThigh, leftKnee, leftCalf, leftFoot);
      solveLegIK(hipR, new THREE.Vector3(0.11, pedalRY, pedalRZ), rightThigh, rightKnee, rightCalf, rightFoot);

      const swayAngle = Math.sin(pedalAngle) * (currentWatts > 240 ? 0.045 : 0.018);
      cyclistGroup.rotation.z = swayAngle;
    }

    function solveLegIK(hip, ankle, thighMesh, kneeMesh, calfMesh, footMesh) {
      const L1 = 0.37, L2 = 0.37;
      const dy = ankle.y - hip.y;
      const dz = ankle.z - hip.z;
      const dist = Math.min(Math.sqrt(dy * dy + dz * dz), L1 + L2 - 0.005);
      const baseAngle = Math.atan2(dy, dz);
      const cosAlpha = (L1 * L1 + dist * dist - L2 * L2) / (2 * L1 * dist);
      const alpha = Math.acos(Math.max(-1, Math.min(1, cosAlpha)));
      const kneeAngle = baseAngle + alpha;

      const kneePos = new THREE.Vector3(
        hip.x,
        hip.y + Math.sin(kneeAngle) * L1,
        hip.z + Math.cos(kneeAngle) * L1
      );
      kneeMesh.position.copy(kneePos);

      const thighDir = new THREE.Vector3().subVectors(kneePos, hip);
      thighMesh.position.copy(hip).add(kneePos).multiplyScalar(0.5);
      thighMesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), thighDir.normalize());

      const calfDir = new THREE.Vector3().subVectors(ankle, kneePos);
      calfMesh.position.copy(kneePos).add(ankle).multiplyScalar(0.5);
      calfMesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), calfDir.normalize());

      footMesh.position.set(ankle.x, ankle.y - 0.01, ankle.z + 0.04);
    }

    // ─── DÉFILEMENT DE LA ROUTE & ANIMATION DES 150 COUREURS DU PELOTON ──────
    function updateWorld(delta) {
      const effectiveSpeed = Math.max(currentSpeed, 6.5);
      const moveDistance = effectiveSpeed * delta;
      distanceTraveled += moveDistance;

      const segmentLength = 4.0;
      const totalRoadLength = roadSegments.length * segmentLength;
      const riderCurveX = getRoadCurveX(distanceTraveled) + smoothLateralLane;
      const riderSlopeX = getRoadCurveDerivative(distanceTraveled);

      cyclistGroup.position.x = riderCurveX;
      cyclistGroup.rotation.y = Math.atan(riderSlopeX) * 0.65;

      for (let i = 0; i < roadSegments.length; i++) {
        const seg = roadSegments[i];
        seg.position.z -= moveDistance;
        if (seg.position.z < -26.0) {
          seg.position.z += totalRoadLength;
        }
        const worldZ = distanceTraveled + seg.position.z;
        seg.position.x = getRoadCurveX(worldZ);
        seg.rotation.y = Math.atan(getRoadCurveDerivative(worldZ));
      }

      if (workoutArch) {
        workoutArch.position.z -= moveDistance;
        if (workoutArch.position.z < -15) workoutArch.position.z = 140;
        const archWorldZ = distanceTraveled + workoutArch.position.z;
        workoutArch.position.x = getRoadCurveX(archWorldZ);
        workoutArch.rotation.y = Math.atan(getRoadCurveDerivative(archWorldZ));
      }

      // Positionnement dynamique des 150 coureurs autour du joueur selon sa place (smoothPlayerRank : 1..150)
      // Quand la pente est forte ou que ça attaque, le peloton de 150 coureurs s'étire en file indienne !
      const stretchFactor = 1.0 + Math.max(0, currentSlope) * 0.14;
      const playerRowEquivalent = (smoothPlayerRank - 1) / 5.0;

      for (let a = 0; a < peloton150Pool.length; a++) {
        const ai = peloton150Pool[a];
        const ud = ai.userData;

        // Si le coureur a un rang plus petit (ex: 1er) que le joueur (ex: 45e), il est DEVANT (+Z)
        // Si le coureur a un rang plus grand (ex: 120e), il est DERRIÈRE (-Z)
        const rowDelta = playerRowEquivalent - ud.row;
        const zBase = rowDelta * 2.35 * stretchFactor;
        const zWave = Math.sin(distanceTraveled * 0.06 + ud.phase) * 0.55;
        const zPos = zBase + zWave;

        // Éviter la collision visuelle exacte avec l'avatar du joueur en (0, 0)
        let xOff = ud.laneX + Math.cos(distanceTraveled * 0.04 + ud.phase) * 0.18;
        if (Math.abs(zPos) < 1.6 && Math.abs(xOff - smoothLateralLane) < 0.55) {
          xOff += (xOff >= smoothLateralLane ? 0.65 : -0.65);
        }

        const aiWorldZ = distanceTraveled + zPos;
        const curveX = getRoadCurveX(aiWorldZ);
        const slopeX = getRoadCurveDerivative(aiWorldZ);

        ai.position.z = zPos;
        ai.position.x = curveX + xOff;
        ai.rotation.y = Math.atan(slopeX) * 0.65;
        ai.rotation.z = Math.sin(pedalAngle + ud.phase) * 0.022;

        // Pédalage rapide des jambes des 150 coureurs
        const legCycle = Math.sin(pedalAngle + ud.phase);
        ud.legL.position.y = 0.64 + legCycle * 0.11;
        ud.legL.rotation.x = legCycle * 0.35;
        ud.legR.position.y = 0.64 - legCycle * 0.11;
        ud.legR.rotation.x = -legCycle * 0.35;
      }

      // Positionnement de la caméra selon le mode actif
      if (cameraMode === 0) {
        // MODE 0 : VUE 3/4 HÉROÏQUE ILLUSTRATION (exactement le cadrage de l'aperçu !)
        const targetCamX = riderCurveX + 1.85;
        camera.position.x += (targetCamX - camera.position.x) * 0.10;
        camera.position.y += (1.52 - camera.position.y) * 0.10;
        camera.position.z += (1.75 - camera.position.z) * 0.10;
        camera.lookAt(riderCurveX - 0.3, 1.08, -0.2);
      } else if (cameraMode === 1) {
        // MODE 1 : VUE IMMERSION ARRIÈRE AU CŒUR DU PELOTON DE 150 COUREURS
        camera.position.x += (riderCurveX - camera.position.x) * 0.10;
        camera.position.y += (2.15 - camera.position.y) * 0.10;
        camera.position.z += (-3.6 - camera.position.z) * 0.10;
        camera.lookAt(riderCurveX + riderSlopeX * 3.0, 1.25, 6.0);
      } else {
        // MODE 2 : VUE HÉLICOPTÈRE TV GRAND TOUR (Vue panoramique des 150 coureurs)
        camera.position.x += (riderCurveX + 4.5 - camera.position.x) * 0.08;
        camera.position.y += (7.5 - camera.position.y) * 0.08;
        camera.position.z += (-9.5 - camera.position.z) * 0.08;
        camera.lookAt(riderCurveX, 1.0, 8.0);
      }
    }

    function animate() {
      requestAnimationFrame(animate);
      const delta = Math.min(clock.getDelta(), 0.1);
      updatePedaling(delta);
      updateWorld(delta);
      renderer.render(scene, camera);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // ─── PONT JAVASCRIPT AVEC FLUTTER ─────────────────────────────────────────
    window.setRiderTelemetry = function(watts, cadence, speedKmh, slope, gear, playerRank150, lateralLane) {
      targetWatts = Number(watts) || 0;
      targetCadence = Number(cadence) || 0;
      targetSpeed = (Number(speedKmh) || 0) / 3.6;
      currentSlope = Number(slope) || 0.0;
      currentGear = Number(gear) || 14;
      if (typeof playerRank150 === 'number' && playerRank150 >= 1) {
        targetPlayerRank = Math.max(1, Math.min(150, playerRank150));
      }
      if (typeof lateralLane === 'number') {
        targetLateralLane = lateralLane;
      }
    };

    window.setCameraMode = function(modeIndex) {
      cameraMode = Number(modeIndex) % 3;
    };

    window.setEnvironmentTheme = function(themeKey) {
      if (!groundMesh || !scene) return;
      if (themeKey === 'ventoux_lunar') {
        groundMesh.material.color.setHex(0xe2e8f0);
      } else if (themeKey === 'alpine_snow') {
        groundMesh.material.color.setHex(0xf1f5f9);
      } else if (themeKey === 'cobbles_flanders') {
        groundMesh.material.color.setHex(0x65a30d);
      } else if (themeKey === 'mediterranean') {
        groundMesh.material.color.setHex(0x84cc16);
      } else {
        groundMesh.material.color.setHex(0x4ade80);
      }
    };

    window.setPlayerEquipmentColors = function(bikeHexInt, jerseyHexInt) {
      if (playerBikeFrameMat && bikeHexInt) {
        playerBikeFrameMat.color.setHex(Number(bikeHexInt));
      }
    };

    window.setGraphicsQuality = function(presetKey) {
      if (!renderer) return;
      if (presetKey === 'eco') {
        renderer.setPixelRatio(1.0);
        renderer.shadowMap.enabled = false;
      } else if (presetKey === 'ultra') {
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2.0));
        renderer.shadowMap.enabled = true;
      } else {
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
        renderer.shadowMap.enabled = true;
      }
    };

    window.onload = init;
  </script>
</body>
</html>
