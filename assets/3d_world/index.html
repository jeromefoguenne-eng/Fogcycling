<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>Fogcycling 3D World</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #38bdf8; }
    #canvas-container { width: 100%; height: 100%; display: block; }
  </style>
  <script src="three.min.js"></script>
</head>
<body>
  <div id="canvas-container"></div>

  <script>
    // ==============================================================================
    // FOGCYCLING 3D CARTOON ENGINE v2.0 (THREE.JS / WEBGL)
    // - Vélo de route orienté dans l'axe Z avec vraies roues à rayons (plan YZ)
    // - Cinématique inverse (IK) des jambes verrouillée sur la cadence réelle
    // - Portiques lumineux 3D pour les changements d'intervalles d'entraînement
    // ==============================================================================

    let scene, camera, renderer;
    let cyclistGroup, bikeFrame, frontWheelGroup, rearWheelGroup, crankset;
    let leftThigh, leftCalf, leftFoot, rightThigh, rightCalf, rightFoot, leftKnee, rightKnee;
    let roadSegments = [], cloudPool = [], aiRidersPool = [];
    let workoutArch, groundMesh, playerBikeFrameMat, playerJerseyMat;

    // Télémétrie reçue de Flutter / Zwift Hub
    let targetWatts = 0, currentWatts = 0;
    let targetCadence = 0, currentCadence = 0;
    let targetSpeed = 0, currentSpeed = 0; // en m/s
    let currentSlope = 0.0;
    let currentGear = 10;
    let distanceTraveled = 0;

    let pedalAngle = 0;
    let clock = new THREE.Clock();

    // Courbure de la route
    function getRoadCurveX(zWorld) {
      return Math.sin(zWorld * 0.018) * 3.2 + Math.cos(zWorld * 0.007) * 1.5;
    }

    function getRoadCurveDerivative(zWorld) {
      return Math.cos(zWorld * 0.018) * 0.018 * 3.2 - Math.sin(zWorld * 0.007) * 0.007 * 1.5;
    }

    function init() {
      const container = document.getElementById('canvas-container');

      // 1. SCÈNE & ATMOSPHÈRE ALPINE CARTOON
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x60a5fa);
      scene.fog = new THREE.FogExp2(0x93c5fd, 0.0065);

      // 2. CAMÉRA 3RD PERSON DYNAMIQUE
      camera = new THREE.PerspectiveCamera(52, window.innerWidth / window.innerHeight, 0.1, 800);
      camera.position.set(0, 2.15, -3.8);
      camera.lookAt(0, 1.25, 4.0);

      // 3. MOTEUR DE RENDU WEBGL HAUTE FIDÉLITÉ
      renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      if (THREE.ACESFilmicToneMapping) {
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.1;
      }
      container.appendChild(renderer.domElement);

      // 4. ÉCLAIRAGE DE STUDIO EN PLEIN AIR
      const hemiLight = new THREE.HemisphereLight(0xe0f2fe, 0x15803d, 0.85);
      scene.add(hemiLight);

      const sunLight = new THREE.DirectionalLight(0xfef08a, 1.25);
      sunLight.position.set(25, 45, -20);
      sunLight.castShadow = true;
      sunLight.shadow.mapSize.width = 1024;
      sunLight.shadow.mapSize.height = 1024;
      sunLight.shadow.camera.near = 5;
      sunLight.shadow.camera.far = 120;
      sunLight.shadow.camera.left = -18;
      sunLight.shadow.camera.right = 18;
      sunLight.shadow.camera.top = 18;
      sunLight.shadow.camera.bottom = -18;
      scene.add(sunLight);

      // Soleil visuel dans le ciel
      const sunMesh = new THREE.Mesh(
        new THREE.SphereGeometry(8, 24, 24),
        new THREE.MeshBasicMaterial({ color: 0xfef08a })
      );
      sunMesh.position.set(65, 85, 220);
      scene.add(sunMesh);

      // 5. ENVIRONNEMENT (SOL, MONTAGNES, NUAGES, ROUTE)
      createTerrain();
      createMountains();
      createClouds();
      createRoadStream();
      createWorkoutArch();

      // 6. VÉLO DE COURSE, AVATAR JOUEUR & PELOTON IA (ÉQUIPIERS + ADVERSAIRES)
      createCartoonCyclistAndBike();
      createAiPeloton3D();

      window.addEventListener('resize', onWindowResize, false);
      animate();
    }

    // ─── TERRAIN ET DÉCORS ───────────────────────────────────────────────────
    function createTerrain() {
      const groundGeo = new THREE.PlaneGeometry(400, 400);
      const groundMat = new THREE.MeshToonMaterial({ color: 0x4ade80 });
      groundMesh = new THREE.Mesh(groundGeo, groundMat);
      groundMesh.rotation.x = -Math.PI / 2;
      groundMesh.position.y = -0.05;
      groundMesh.receiveShadow = true;
      scene.add(groundMesh);
    }

    // Création du Peloton 3D (Vos Équipiers en Bleu/Or + Leaders Maillot Jaune, Pois, Vert)
    function createAiPeloton3D() {
      const pelotonConfigs = [
        { jersey: 0x0284c7, helmet: 0xfacc15, zOffset: 2.3, xOffset: -0.35, isTeammate: true },  // Équipier #1 (Poisson-Pilote)
        { jersey: 0x0284c7, helmet: 0xfacc15, zOffset: 3.8, xOffset: 0.45, isTeammate: true },   // Équipier #2 (Grimpeur)
        { jersey: 0xfacc15, helmet: 0xfacc15, zOffset: 6.2, xOffset: -0.75, isTeammate: false }, // Leader Maillot Jaune
        { jersey: 0x22c55e, helmet: 0x16a34a, zOffset: 5.0, xOffset: 0.85, isTeammate: false },  // Leader Maillot Vert
        { jersey: 0xef4444, helmet: 0xffffff, zOffset: 8.0, xOffset: 0.10, isTeammate: false },  // Leader Maillot à Pois
        { jersey: 0x9333ea, helmet: 0xf8fafc, zOffset: 10.5, xOffset: -0.55, isTeammate: false } // Rival Pro
      ];

      for (let i = 0; i < pelotonConfigs.length; i++) {
        const cfg = pelotonConfigs[i];
        const aiRider = new THREE.Group();

        const darkMat = new THREE.MeshToonMaterial({ color: 0x0f172a });
        const frameMat = new THREE.MeshToonMaterial({ color: cfg.isTeammate ? 0xf97316 : 0xe2e8f0 });
        const jerseyMat = new THREE.MeshToonMaterial({ color: cfg.jersey });
        const helmetMat = new THREE.MeshToonMaterial({ color: cfg.helmet });
        const skinMat = new THREE.MeshToonMaterial({ color: 0xfdba74 });

        // Roues avant et arrière (dans le plan YZ !)
        const rWheel = createBikeWheel(0.32);
        rWheel.position.set(0, 0.32, -0.48);
        aiRider.add(rWheel);

        const fWheel = createBikeWheel(0.32);
        fWheel.position.set(0, 0.32, 0.48);
        aiRider.add(fWheel);

        // Cadre simplifié
        aiRider.add(createTubeBetween(new THREE.Vector3(0, 0.30, -0.08), new THREE.Vector3(0, 0.78, -0.22), 0.022, frameMat));
        aiRider.add(createTubeBetween(new THREE.Vector3(0, 0.78, -0.22), new THREE.Vector3(0, 0.80, 0.38), 0.022, frameMat));
        aiRider.add(createTubeBetween(new THREE.Vector3(0, 0.30, -0.08), new THREE.Vector3(0, 0.65, 0.40), 0.024, frameMat));

        // Corps & Maillot distinctif
        const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.12, 0.42, 12), jerseyMat);
        torso.position.set(0, 1.12, -0.05);
        torso.rotation.x = Math.PI / 3.4;
        torso.castShadow = true;
        aiRider.add(torso);

        const pelvis = new THREE.Mesh(new THREE.SphereGeometry(0.135, 10, 10), darkMat);
        pelvis.position.set(0, 0.96, -0.22);
        aiRider.add(pelvis);

        // Tête & Casque
        const head = new THREE.Mesh(new THREE.SphereGeometry(0.11, 12, 12), skinMat);
        head.position.set(0, 1.38, 0.15);
        aiRider.add(head);

        const helmet = new THREE.Mesh(new THREE.SphereGeometry(0.125, 12, 12), helmetMat);
        helmet.scale.set(1.0, 0.85, 1.25);
        helmet.position.set(0, 1.42, 0.15);
        aiRider.add(helmet);

        // Halo lumineux au sol lorsqu'un coureur en ligne lance une ATTAQUE (>4.0 W/kg)
        const haloGeo = new THREE.RingGeometry(0.45, 0.62, 24);
        haloGeo.rotateX(-Math.PI / 2);
        const haloMat = new THREE.MeshBasicMaterial({ color: 0xef4444, side: THREE.DoubleSide });
        const attackHalo = new THREE.Mesh(haloGeo, haloMat);
        attackHalo.position.set(0, 0.06, 0);
        attackHalo.visible = false;
        aiRider.add(attackHalo);

        aiRider.userData = {
          baseZ: cfg.zOffset,
          targetZ: cfg.zOffset,
          xOffset: cfg.xOffset,
          targetX: cfg.xOffset,
          rWheel: rWheel,
          fWheel: fWheel,
          jerseyMat: jerseyMat,
          frameMat: frameMat,
          attackHalo: attackHalo,
          phase: i * 1.1
        };

        aiRidersPool.push(aiRider);
        scene.add(aiRider);
      }
    }

    function createMountains() {
      const mtnColors = [0x64748b, 0x475569, 0x334155];
      const snowMat = new THREE.MeshToonMaterial({ color: 0xf8fafc });

      for (let i = 0; i < 24; i++) {
        const height = 35 + Math.random() * 55;
        const radius = 22 + Math.random() * 28;
        const mtnGroup = new THREE.Group();

        const mtnGeo = new THREE.ConeGeometry(radius, height, 7);
        const mtnMat = new THREE.MeshToonMaterial({ color: mtnColors[i % mtnColors.length] });
        const mtn = new THREE.Mesh(mtnGeo, mtnMat);
        mtn.position.y = height / 2 - 2;
        mtnGroup.add(mtn);

        // Sommet enneigé cartoon
        const capHeight = height * 0.32;
        const capRadius = radius * 0.33;
        const capGeo = new THREE.ConeGeometry(capRadius, capHeight, 7);
        const cap = new THREE.Mesh(capGeo, snowMat);
        cap.position.y = height - capHeight / 2 - 1.8;
        mtnGroup.add(cap);

        const side = (i % 2 === 0) ? 1 : -1;
        mtnGroup.position.x = side * (40 + Math.random() * 90);
        mtnGroup.position.z = 40 + i * 14;
        mtnGroup.rotation.y = Math.random() * Math.PI;
        scene.add(mtnGroup);
      }
    }

    function createClouds() {
      const cloudMat = new THREE.MeshToonMaterial({ color: 0xffffff });
      for (let i = 0; i < 16; i++) {
        const cloud = new THREE.Group();
        const puffs = 3 + Math.floor(Math.random() * 3);
        for (let p = 0; p < puffs; p++) {
          const puffGeo = new THREE.SphereGeometry(2.8 + Math.random() * 2.2, 10, 10);
          const puff = new THREE.Mesh(puffGeo, cloudMat);
          puff.position.set(p * 2.6, Math.random() * 1.2, Math.random() * 1.5);
          cloud.add(puff);
        }
        cloud.position.set(-90 + Math.random() * 180, 26 + Math.random() * 18, 25 + Math.random() * 190);
        cloudPool.push(cloud);
        scene.add(cloud);
      }
    }

    function createPineTree() {
      const tree = new THREE.Group();
      const trunkMat = new THREE.MeshToonMaterial({ color: 0x78350f });
      const leavesMat = new THREE.MeshToonMaterial({ color: 0x15803d });
      const leavesLightMat = new THREE.MeshToonMaterial({ color: 0x16a34a });

      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.28, 1.6, 7), trunkMat);
      trunk.position.y = 0.8;
      trunk.castShadow = true;
      tree.add(trunk);

      const levels = 3;
      for (let l = 0; l < levels; l++) {
        const cone = new THREE.Mesh(
          new THREE.ConeGeometry(1.45 - l * 0.32, 2.1 - l * 0.25, 7),
          l % 2 === 0 ? leavesMat : leavesLightMat
        );
        cone.position.y = 2.0 + l * 1.15;
        cone.castShadow = true;
        tree.add(cone);
      }
      const scale = 0.85 + Math.random() * 0.5;
      tree.scale.set(scale, scale, scale);
      return tree;
    }

    function createRoadStream() {
      const segmentCount = 45;
      const segmentLength = 4.0;

      const asphaltMat = new THREE.MeshToonMaterial({ color: 0x334155 });
      const shoulderMat = new THREE.MeshToonMaterial({ color: 0x94a3b8 });
      const edgeLineMat = new THREE.MeshBasicMaterial({ color: 0xe2e8f0 });
      const centerLineMat = new THREE.MeshBasicMaterial({ color: 0xfacc15 });
      const postMat = new THREE.MeshToonMaterial({ color: 0xf8fafc });
      const reflectorMat = new THREE.MeshBasicMaterial({ color: 0xef4444 });

      for (let i = 0; i < segmentCount; i++) {
        const segGroup = new THREE.Group();

        // Accotement stabilisé
        const shoulder = new THREE.Mesh(new THREE.BoxGeometry(7.8, 0.06, segmentLength + 0.08), shoulderMat);
        shoulder.position.y = -0.02;
        shoulder.receiveShadow = true;
        segGroup.add(shoulder);

        // Ruban d'asphalte
        const road = new THREE.Mesh(new THREE.BoxGeometry(6.8, 0.08, segmentLength + 0.08), asphaltMat);
        road.position.y = 0.0;
        road.receiveShadow = true;
        segGroup.add(road);

        // Lignes de rive blanches continues
        const leftEdge = new THREE.Mesh(new THREE.PlaneGeometry(0.12, segmentLength + 0.08), edgeLineMat);
        leftEdge.rotation.x = -Math.PI / 2;
        leftEdge.position.set(-3.1, 0.045, 0);
        segGroup.add(leftEdge);

        const rightEdge = leftEdge.clone();
        rightEdge.position.x = 3.1;
        segGroup.add(rightEdge);

        // Ligne médiane jaune discontinue
        if (i % 2 === 0) {
          const dash = new THREE.Mesh(new THREE.PlaneGeometry(0.14, 1.8), centerLineMat);
          dash.rotation.x = -Math.PI / 2;
          dash.position.y = 0.046;
          segGroup.add(dash);
        }

        // Bornes kilométriques / délinéateurs de montagne
        if (i % 3 === 0) {
          for (let side of [-1, 1]) {
            const post = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.65, 0.1), postMat);
            post.position.set(side * 3.65, 0.32, 0);
            segGroup.add(post);

            const ref = new THREE.Mesh(new THREE.BoxGeometry(0.11, 0.12, 0.11), reflectorMat);
            ref.position.set(side * 3.65, 0.52, 0);
            segGroup.add(ref);
          }
        }

        // Sapins et rochers sur les bas-côtés
        if (i % 2 === 0) {
          const leftTree = createPineTree();
          leftTree.position.set(-5.8 - Math.random() * 9, 0, (Math.random() - 0.5) * 2);
          segGroup.add(leftTree);

          const rightTree = createPineTree();
          rightTree.position.set(5.8 + Math.random() * 9, 0, (Math.random() - 0.5) * 2);
          segGroup.add(rightTree);
        }

        segGroup.userData = { baseZ: i * segmentLength - 12 };
        segGroup.position.z = segGroup.userData.baseZ;
        roadSegments.push(segGroup);
        scene.add(segGroup);
      }
    }

    // Portique lumineux d'intervalle façon Zwift
    function createWorkoutArch() {
      workoutArch = new THREE.Group();
      const archPillarMat = new THREE.MeshToonMaterial({ color: 0x0f172a });
      const archGlowMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8 });

      // Piliers gauche et droit
      const leftPillar = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.28, 4.8, 12), archPillarMat);
      leftPillar.position.set(-3.6, 2.4, 0);
      workoutArch.add(leftPillar);

      const rightPillar = leftPillar.clone();
      rightPillar.position.x = 3.6;
      workoutArch.add(rightPillar);

      // Bandeau supérieur lumineux
      const topBanner = new THREE.Mesh(new THREE.BoxGeometry(7.8, 0.75, 0.35), archPillarMat);
      topBanner.position.set(0, 4.6, 0);
      workoutArch.add(topBanner);

      const neonStrip = new THREE.Mesh(new THREE.BoxGeometry(7.4, 0.45, 0.4), archGlowMat);
      neonStrip.position.set(0, 4.6, 0);
      workoutArch.add(neonStrip);

      workoutArch.position.z = 85;
      workoutArch.visible = true;
      scene.add(workoutArch);
    }

    // ─── CRÉATION D'UNE ROUE DE VÉLO RÉALISTE (DANS LE PLAN YZ) ───────────────
    function createBikeWheel(radius) {
      const wheelGroup = new THREE.Group();

      // Pneu noir (Torus tourné de 90° sur Y pour être dans le plan YZ de la route !)
      const tireGeo = new THREE.TorusGeometry(radius, 0.028, 12, 32);
      tireGeo.rotateY(Math.PI / 2);
      const tireMat = new THREE.MeshToonMaterial({ color: 0x0f172a });
      const tire = new THREE.Mesh(tireGeo, tireMat);
      tire.castShadow = true;
      wheelGroup.add(tire);

      // Jante Carbone Profil Haut
      const rimGeo = new THREE.TorusGeometry(radius - 0.032, 0.022, 8, 32);
      rimGeo.rotateY(Math.PI / 2);
      const rimMat = new THREE.MeshToonMaterial({ color: 0x1e293b });
      const rim = new THREE.Mesh(rimGeo, rimMat);
      wheelGroup.add(rim);

      // Marquages colorés sur la jante pour bien voir la rotation de la roue !
      const decalMat = new THREE.MeshBasicMaterial({ color: 0xf97316 });
      for (let d = 0; d < 3; d++) {
        const angle = (d * Math.PI * 2) / 3;
        const decal = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.035, 0.12), decalMat);
        decal.position.set(0, Math.sin(angle) * (radius - 0.035), Math.cos(angle) * (radius - 0.035));
        decal.rotation.x = -angle;
        wheelGroup.add(decal);
      }

      // Moyeu central (Axe X)
      const hubGeo = new THREE.CylinderGeometry(0.028, 0.028, 0.11, 12);
      hubGeo.rotateZ(Math.PI / 2);
      const hubMat = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, metalness: 0.8, roughness: 0.2 });
      const hub = new THREE.Mesh(hubGeo, hubMat);
      wheelGroup.add(hub);

      // Rayons métalliques (dans le plan YZ) pour visualiser parfaitement le roulement
      const spokeMat = new THREE.MeshBasicMaterial({ color: 0x94a3b8 });
      const spokeCount = 12;
      for (let i = 0; i < spokeCount; i++) {
        const angle = (i * Math.PI) / (spokeCount / 2);
        const spokeGeo = new THREE.CylinderGeometry(0.003, 0.003, (radius - 0.04) * 2, 6);
        const spoke = new THREE.Mesh(spokeGeo, spokeMat);
        spoke.rotation.x = angle;
        wheelGroup.add(spoke);
      }

      return wheelGroup;
    }

    // Helper pour relier deux points 3D par un tube de cadre de vélo
    function createTubeBetween(p1, p2, thickness, material) {
      const dir = new THREE.Vector3().subVectors(p2, p1);
      const len = dir.length();
      const geo = new THREE.CylinderGeometry(thickness, thickness, len, 10);
      const mesh = new THREE.Mesh(geo, material);
      mesh.position.copy(p1).add(p2).multiplyScalar(0.5);
      mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize());
      mesh.castShadow = true;
      return mesh;
    }

    // ─── VÉLO DE COURSE & AVATAR CYCLISTE 3D (AXE Z) ─────────────────────────
    function createCartoonCyclistAndBike() {
      cyclistGroup = new THREE.Group();
      bikeFrame = new THREE.Group();

      const frameMat = new THREE.MeshToonMaterial({ color: 0xf97316 }); // Cadre Orange Carbone
      playerBikeFrameMat = frameMat;
      const darkMat = new THREE.MeshToonMaterial({ color: 0x0f172a });  // Carbone mat
      const chromeMat = new THREE.MeshStandardMaterial({ color: 0xcbd5e1, metalness: 0.8, roughness: 0.2 });

      const wheelRadius = 0.34;
      const rearAxle = new THREE.Vector3(0, wheelRadius, -0.52);
      const frontAxle = new THREE.Vector3(0, wheelRadius, 0.54);
      const bottomBracket = new THREE.Vector3(0, 0.29, -0.08);
      const seatNode = new THREE.Vector3(0, 0.82, -0.24);
      const headTubeTop = new THREE.Vector3(0, 0.84, 0.40);
      const headTubeBottom = new THREE.Vector3(0, 0.68, 0.44);

      // 1. Roues Avant et Arrière (parfaitement orientées dans le sens de la marche)
      frontWheelGroup = createBikeWheel(wheelRadius);
      frontWheelGroup.position.copy(frontAxle);
      bikeFrame.add(frontWheelGroup);

      rearWheelGroup = createBikeWheel(wheelRadius);
      rearWheelGroup.position.copy(rearAxle);
      bikeFrame.add(rearWheelGroup);

      // 2. Triangles du Cadre de Vélo (dans le plan YZ !)
      // Tube horizontal (Top tube)
      bikeFrame.add(createTubeBetween(seatNode, headTubeTop, 0.024, frameMat));
      // Tube diagonal (Down tube)
      bikeFrame.add(createTubeBetween(bottomBracket, headTubeBottom, 0.028, frameMat));
      // Tube de selle (Seat tube)
      bikeFrame.add(createTubeBetween(bottomBracket, seatNode, 0.024, frameMat));
      // Douille de direction (Head tube)
      bikeFrame.add(createTubeBetween(headTubeBottom, headTubeTop, 0.026, frameMat));

      // Haubans et bases arrière (Dual stays gauche/droite)
      for (let side of [-0.045, 0.045]) {
        const rAxleSide = new THREE.Vector3(side, rearAxle.y, rearAxle.z);
        const bbSide = new THREE.Vector3(side * 0.6, bottomBracket.y, bottomBracket.z);
        const seatSide = new THREE.Vector3(side * 0.4, seatNode.y - 0.05, seatNode.z);
        bikeFrame.add(createTubeBetween(bbSide, rAxleSide, 0.014, frameMat));
        bikeFrame.add(createTubeBetween(seatSide, rAxleSide, 0.012, frameMat));

        // Fourche avant
        const fAxleSide = new THREE.Vector3(side, frontAxle.y, frontAxle.z);
        const forkCrown = new THREE.Vector3(side * 0.4, headTubeBottom.y, headTubeBottom.z);
        bikeFrame.add(createTubeBetween(forkCrown, fAxleSide, 0.015, frameMat));
      }

      // Tige de selle et Selle ergonomique
      const seatPostTop = new THREE.Vector3(0, 0.96, -0.28);
      bikeFrame.add(createTubeBetween(seatNode, seatPostTop, 0.018, darkMat));
      const saddle = new THREE.Mesh(new THREE.BoxGeometry(0.13, 0.04, 0.26), darkMat);
      saddle.position.copy(seatPostTop);
      bikeFrame.add(saddle);

      // Potence et Cintre de route (Guidon)
      const stemEnd = new THREE.Vector3(0, 0.90, 0.48);
      bikeFrame.add(createTubeBetween(headTubeTop, stemEnd, 0.018, darkMat));
      const handlebar = new THREE.Mesh(new THREE.CylinderGeometry(0.016, 0.016, 0.42, 10), darkMat);
      handlebar.rotation.z = Math.PI / 2;
      handlebar.position.copy(stemEnd);
      bikeFrame.add(handlebar);

      // Cocottes de frein
      for (let side of [-0.19, 0.19]) {
        const hood = new THREE.Mesh(new THREE.BoxGeometry(0.035, 0.07, 0.09), darkMat);
        hood.position.set(side, 0.92, 0.53);
        bikeFrame.add(hood);
      }

      // 3. Pédalier & Manivelles (Crankset)
      crankset = new THREE.Group();
      crankset.position.copy(bottomBracket);

      const chainring = new THREE.Mesh(new THREE.CylinderGeometry(0.10, 0.10, 0.015, 20), darkMat);
      chainring.rotation.z = Math.PI / 2;
      chainring.position.x = 0.05;
      crankset.add(chainring);

      // Manivelle Gauche (vers +Y quand angle = 0)
      const crankArmGeo = new THREE.BoxGeometry(0.018, 0.17, 0.032);
      const leftCrank = new THREE.Mesh(crankArmGeo, chromeMat);
      leftCrank.position.set(-0.07, 0.08, 0);
      crankset.add(leftCrank);

      // Manivelle Droite (vers -Y quand angle = 0)
      const rightCrank = new THREE.Mesh(crankArmGeo, chromeMat);
      rightCrank.position.set(0.07, -0.08, 0);
      crankset.add(rightCrank);

      bikeFrame.add(crankset);
      cyclistGroup.add(bikeFrame);

      // ─── 4. LE CORPS DU CYCLISTE CARTOON STYLISÉ ───
      const skinMat = new THREE.MeshToonMaterial({ color: 0xfdba74 });   // Peau dorée chaleureuse
      const jerseyMat = new THREE.MeshToonMaterial({ color: 0x0284c7 }); // Maillot Bleu Pro Fogcycling
      playerJerseyMat = jerseyMat;
      const stripeMat = new THREE.MeshToonMaterial({ color: 0xfacc15 }); // Bande jaune maillot
      const shortsMat = new THREE.MeshToonMaterial({ color: 0x0f172a }); // Cuissard Noir
      const helmetMat = new THREE.MeshToonMaterial({ color: 0xf8fafc }); // Casque Blanc Aero
      const shoeMat = new THREE.MeshToonMaterial({ color: 0xffffff });   // Chaussures blanches

      // Bassin / Hanches sur la selle
      const pelvis = new THREE.Mesh(new THREE.SphereGeometry(0.145, 14, 14), shortsMat);
      pelvis.scale.set(1.1, 0.85, 1.0);
      pelvis.position.set(0, 1.02, -0.25);
      cyclistGroup.add(pelvis);

      // Buste / Torso aérodynamique
      const torsoGroup = new THREE.Group();
      torsoGroup.position.set(0, 1.18, -0.06);
      torsoGroup.rotation.x = Math.PI / 3.4; // Penché vers le guidon

      const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.13, 0.44, 14), jerseyMat);
      torso.scale.set(1.15, 1.0, 0.82);
      torso.castShadow = true;
      torsoGroup.add(torso);

      // Bande distinctive sur le dos du maillot
      const stripe = new THREE.Mesh(new THREE.CylinderGeometry(0.153, 0.142, 0.12, 14), stripeMat);
      stripe.scale.set(1.15, 1.0, 0.83);
      stripe.position.y = 0.04;
      torsoGroup.add(stripe);

      // Épaules arrondies
      const shoulders = new THREE.Mesh(new THREE.SphereGeometry(0.16, 14, 14), jerseyMat);
      shoulders.scale.set(1.25, 0.7, 0.85);
      shoulders.position.y = 0.20;
      torsoGroup.add(shoulders);

      cyclistGroup.add(torsoGroup);

      // Tête & Casque Aérodynamique
      const headGroup = new THREE.Group();
      headGroup.position.set(0, 1.44, 0.16);

      const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.065, 0.12, 10), skinMat);
      neck.position.set(0, -0.08, -0.03);
      headGroup.add(neck);

      const head = new THREE.Mesh(new THREE.SphereGeometry(0.115, 16, 16), skinMat);
      headGroup.add(head);

      const helmet = new THREE.Mesh(new THREE.SphereGeometry(0.132, 16, 16), helmetMat);
      helmet.scale.set(1.02, 0.85, 1.28);
      helmet.position.set(0, 0.04, -0.01);
      helmet.castShadow = true;
      headGroup.add(helmet);

      // Visière / Lunettes de vitesse réfléchissantes
      const visor = new THREE.Mesh(
        new THREE.BoxGeometry(0.19, 0.055, 0.08),
        new THREE.MeshBasicMaterial({ color: 0xf97316 })
      );
      visor.position.set(0, 0.01, 0.09);
      headGroup.add(visor);

      cyclistGroup.add(headGroup);

      // Bras reliés des épaules aux cocottes du guidon
      for (let side of [-1, 1]) {
        const shoulderPos = new THREE.Vector3(side * 0.18, 1.30, 0.10);
        const elbowPos = new THREE.Vector3(side * 0.20, 1.08, 0.32);
        const handPos = new THREE.Vector3(side * 0.19, 0.93, 0.52);

        // Manche courte du maillot
        cyclistGroup.add(createTubeBetween(shoulderPos, shoulderPos.clone().lerp(elbowPos, 0.45), 0.048, jerseyMat));
        // Bras & Avant-bras
        cyclistGroup.add(createTubeBetween(shoulderPos.clone().lerp(elbowPos, 0.4), elbowPos, 0.040, skinMat));
        cyclistGroup.add(createTubeBetween(elbowPos, handPos, 0.035, skinMat));

        // Gant sur les cocottes
        const glove = new THREE.Mesh(new THREE.SphereGeometry(0.042, 10, 10), darkMat);
        glove.position.copy(handPos);
        cyclistGroup.add(glove);
      }

      // ─── 5. JAMBES ARTICULÉES EN CINÉMATIQUE INVERSE (CUISSE + GENOU + MOLLET + CHAUSSURE) ───
      const thighGeo = new THREE.CylinderGeometry(0.068, 0.052, 0.36, 12);
      const calfGeo = new THREE.CylinderGeometry(0.050, 0.036, 0.36, 12);
      const kneeGeo = new THREE.SphereGeometry(0.052, 10, 10);
      const shoeGeo = new THREE.BoxGeometry(0.085, 0.055, 0.19);

      // Jambe Gauche
      leftThigh = new THREE.Mesh(thighGeo, shortsMat);
      leftKnee = new THREE.Mesh(kneeGeo, skinMat);
      leftCalf = new THREE.Mesh(calfGeo, skinMat);
      leftFoot = new THREE.Mesh(shoeGeo, shoeMat);
      leftThigh.castShadow = true;
      leftCalf.castShadow = true;
      cyclistGroup.add(leftThigh, leftKnee, leftCalf, leftFoot);

      // Jambe Droite
      rightThigh = new THREE.Mesh(thighGeo, shortsMat);
      rightKnee = new THREE.Mesh(kneeGeo, skinMat);
      rightCalf = new THREE.Mesh(calfGeo, skinMat);
      rightFoot = new THREE.Mesh(shoeGeo, shoeMat);
      rightThigh.castShadow = true;
      rightCalf.castShadow = true;
      cyclistGroup.add(rightThigh, rightKnee, rightCalf, rightFoot);

      scene.add(cyclistGroup);
    }

    // ─── CINÉMATIQUE DE PÉDALAGE ET ROTATION EXACTE DES ROUES ────────────────
    function updatePedaling(delta) {
      currentWatts += (targetWatts - currentWatts) * 0.12;
      currentCadence += (targetCadence - currentCadence) * 0.12;
      currentSpeed += (targetSpeed - currentSpeed) * 0.12;

      // 1. Rotation du pédalier (dans le sens vers l'avant : +X rotation)
      const rps = currentCadence / 60.0;
      pedalAngle += rps * Math.PI * 2 * delta;
      crankset.rotation.x = pedalAngle;

      // 2. Rotation des roues autour de leur axe X (roulement naturel vers l'avant !)
      const wheelCircumference = 2.136; // 700c
      const wheelAngularVel = (currentSpeed / wheelCircumference) * Math.PI * 2;
      frontWheelGroup.rotation.x += wheelAngularVel * delta;
      rearWheelGroup.rotation.x += wheelAngularVel * delta;

      // 3. Cinématique Inverse (IK) des deux jambes dans le plan YZ
      const hipL = new THREE.Vector3(-0.11, 1.00, -0.25);
      const hipR = new THREE.Vector3(0.11, 1.00, -0.25);

      const crankRadius = 0.165;
      // Quand crankset tourne de pedalAngle autour de X :
      // Le point (0, R, 0) devient (0, R*cos(a), R*sin(a))
      const pedalLY = 0.29 + Math.cos(pedalAngle) * crankRadius;
      const pedalLZ = -0.08 + Math.sin(pedalAngle) * crankRadius;

      const pedalRY = 0.29 + Math.cos(pedalAngle + Math.PI) * crankRadius;
      const pedalRZ = -0.08 + Math.sin(pedalAngle + Math.PI) * crankRadius;

      solveLegIK(hipL, new THREE.Vector3(-0.11, pedalLY, pedalLZ), leftThigh, leftKnee, leftCalf, leftFoot);
      solveLegIK(hipR, new THREE.Vector3(0.11, pedalRY, pedalRZ), rightThigh, rightKnee, rightCalf, rightFoot);

      // 4. Dynamique de danseuse et balancement du vélo à haute puissance
      const swayAngle = Math.sin(pedalAngle) * (currentWatts > 240 ? 0.055 : 0.02);
      cyclistGroup.rotation.z = swayAngle;
      if (currentWatts > 260) {
        cyclistGroup.position.y = 0.06;
      } else {
        cyclistGroup.position.y = 0.0;
      }
    }

    // Résolution géométrique exacte du genou (Loi des cosinus 2 segments dans le plan YZ)
    function solveLegIK(hip, ankle, thighMesh, kneeMesh, calfMesh, footMesh) {
      const L1 = 0.37; // Longueur fémur
      const L2 = 0.37; // Longueur tibia

      const dy = ankle.y - hip.y;
      const dz = ankle.z - hip.z;
      const dist = Math.min(Math.sqrt(dy * dy + dz * dz), L1 + L2 - 0.005);

      // Angle entre hanche->cheville et l'horizontale Z
      const baseAngle = Math.atan2(dy, dz);
      // Angle interne du triangle hanche-genou-cheville
      const cosAlpha = (L1 * L1 + dist * dist - L2 * L2) / (2 * L1 * dist);
      const alpha = Math.acos(Math.max(-1, Math.min(1, cosAlpha)));

      // Le genou pointe toujours vers l'avant (+Z / +Y)
      const kneeAngle = baseAngle + alpha;
      const kneePos = new THREE.Vector3(
        hip.x,
        hip.y + Math.sin(kneeAngle) * L1,
        hip.z + Math.cos(kneeAngle) * L1
      );

      // Positionnement du genou
      kneeMesh.position.copy(kneePos);

      // Orientation de la cuisse (Hanche -> Genou)
      const thighDir = new THREE.Vector3().subVectors(kneePos, hip);
      thighMesh.position.copy(hip).add(kneePos).multiplyScalar(0.5);
      thighMesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), thighDir.normalize());

      // Orientation du mollet (Genou -> Cheville)
      const calfDir = new THREE.Vector3().subVectors(ankle, kneePos);
      calfMesh.position.copy(kneePos).add(ankle).multiplyScalar(0.5);
      calfMesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), calfDir.normalize());

      // Chaussure sur la pédale
      footMesh.position.set(ankle.x, ankle.y - 0.01, ankle.z + 0.04);
    }

    // ─── DÉFILEMENT DE LA ROUTE SINUEUSE & ARCHES 3D ─────────────────────────
    function updateWorld(delta) {
      const moveDistance = currentSpeed * delta;
      distanceTraveled += moveDistance;

      const segmentLength = 4.0;
      const totalRoadLength = roadSegments.length * segmentLength;
      const riderCurveX = getRoadCurveX(distanceTraveled);
      const riderSlopeX = getRoadCurveDerivative(distanceTraveled);

      // Positionner le cycliste au centre de la route sinueuse
      cyclistGroup.position.x = riderCurveX;
      cyclistGroup.rotation.y = Math.atan(riderSlopeX) * 0.65;

      for (let i = 0; i < roadSegments.length; i++) {
        const seg = roadSegments[i];
        seg.position.z -= moveDistance;

        if (seg.position.z < -14.0) {
          seg.position.z += totalRoadLength;
        }

        const worldZ = distanceTraveled + seg.position.z;
        seg.position.x = getRoadCurveX(worldZ);
        seg.rotation.y = Math.atan(getRoadCurveDerivative(worldZ));
      }

      // Défilement du portique d'intervalle
      if (workoutArch && workoutArch.visible) {
        workoutArch.position.z -= moveDistance;
        if (workoutArch.position.z < -10) {
          workoutArch.position.z = 120; // Prochain portique à 120m
        }
        const archWorldZ = distanceTraveled + workoutArch.position.z;
        workoutArch.position.x = getRoadCurveX(archWorldZ);
        workoutArch.rotation.y = Math.atan(getRoadCurveDerivative(archWorldZ));
      }

      // Animation du Peloton 3D (Équipiers, Adversaires & Coureurs Multijoueur en Ligne)
      for (let a = 0; a < aiRidersPool.length; a++) {
        const ai = aiRidersPool[a];
        const ud = ai.userData;
        // Interpolation Dead Reckoning 60 FPS fluide vers la cible réseau
        ud.baseZ += (ud.targetZ - ud.baseZ) * 0.08;
        ud.xOffset += (ud.targetX - ud.xOffset) * 0.08;

        const zPos = ud.baseZ + Math.sin(distanceTraveled * 0.08 + ud.phase) * 0.45;
        const aiWorldZ = distanceTraveled + zPos;
        const curveX = getRoadCurveX(aiWorldZ);
        const slopeX = getRoadCurveDerivative(aiWorldZ);

        ai.position.z = zPos;
        ai.position.x = curveX + ud.xOffset;
        ai.rotation.y = Math.atan(slopeX) * 0.65;
        ai.rotation.z = Math.sin(pedalAngle + ud.phase) * 0.025;

        const wAng = (Math.max(currentSpeed, 6.5) / 2.1) * Math.PI * 2 * delta;
        ud.rWheel.rotation.x += wAng;
        ud.fWheel.rotation.x += wAng;
      }

      // Nuages
      for (let c = 0; c < cloudPool.length; c++) {
        cloudPool[c].position.x += delta * 0.7;
        if (cloudPool[c].position.x > 95) cloudPool[c].position.x = -95;
      }

      // Caméra suiveuse souple derrière le cycliste
      camera.position.x += (riderCurveX - camera.position.x) * 0.08;
      camera.lookAt(riderCurveX + riderSlopeX * 3.0, 1.25, 4.5);
    }

    function animate() {
      requestAnimationFrame(animate);
      const delta = Math.min(clock.getDelta(), 0.1);

      updatePedaling(delta);
      updateWorld(delta);

      renderer.render(scene, camera);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // ─── PONT JAVASCRIPT AVEC FLUTTER ─────────────────────────────────────────
    window.setRiderTelemetry = function(watts, cadence, speedKmh, slope, gear) {
      targetWatts = Number(watts) || 0;
      targetCadence = Number(cadence) || 0;
      targetSpeed = (Number(speedKmh) || 0) / 3.6;
      currentSlope = Number(slope) || 0.0;
      currentGear = Number(gear) || 10;
    };

    window.setEnvironmentTheme = function(themeKey) {
      if (!groundMesh || !scene) return;
      if (themeKey === 'ventoux_lunar') {
        groundMesh.material.color.setHex(0xe2e8f0); // Calcaire blanc lunaire du Ventoux
        scene.background.setHex(0x38bdf8);
      } else if (themeKey === 'alpine_snow') {
        groundMesh.material.color.setHex(0xf1f5f9); // Neiges éternelles Galibier / Stelvio
        scene.background.setHex(0x60a5fa);
      } else if (themeKey === 'cobbles_flanders') {
        groundMesh.material.color.setHex(0x65a30d); // Prairies des Flandres / Roubaix
        scene.background.setHex(0x94a3b8);
      } else if (themeKey === 'mediterranean') {
        groundMesh.material.color.setHex(0x84cc16); // Riviera Poggio Sanremo
        scene.background.setHex(0x0ea5e9);
      } else {
        groundMesh.material.color.setHex(0x4ade80); // Forêts Ardennaises (Huy, Redoute)
        scene.background.setHex(0x60a5fa);
      }
    };

    window.setPlayerEquipmentColors = function(bikeHexInt, jerseyHexInt) {
      if (playerBikeFrameMat && bikeHexInt) {
        playerBikeFrameMat.color.setHex(Number(bikeHexInt));
      }
      if (playerJerseyMat && jerseyHexInt) {
        playerJerseyMat.color.setHex(Number(jerseyHexInt));
      }
    };

    // Synchronisation Multijoueur Temps Réel (Phase 6 - Dead Reckoning)
    window.updateMultiplayerRiders = function(ridersList) {
      if (!Array.isArray(ridersList) || !aiRidersPool.length) return;
      for (let i = 0; i < aiRidersPool.length && i < ridersList.length; i++) {
        const rData = ridersList[i];
        const ud = aiRidersPool[i].userData;
        if (typeof rData.zOffset === 'number') ud.targetZ = rData.zOffset;
        if (typeof rData.xOffset === 'number') ud.targetX = rData.xOffset;
        if (rData.jersey && ud.jerseyMat) ud.jerseyMat.color.setHex(Number(rData.jersey));
        if (rData.bike && ud.frameMat) ud.frameMat.color.setHex(Number(rData.bike));
        if (ud.attackHalo) ud.attackHalo.visible = Boolean(rData.isAttacking);
      }
    };

    window.onload = init;
  </script>
