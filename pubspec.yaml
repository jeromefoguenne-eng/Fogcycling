name: fogcycling
description: "Fogcycling - Mobile 3D Virtual Cycling with Cartoon World & Coach Stravos"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_blue_plus: ^2.3.14
  provider: ^6.1.5+1
  intl: ^0.20.3
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/3d_world/
    - assets/3d_world/three.min.js
    - assets/3d_world/index.html
